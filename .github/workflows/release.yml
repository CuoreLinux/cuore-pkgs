name: Release

# Builds every package, signs it with Cuore's release signing subkey, and
# publishes the signed repository as the GitHub release <channel>-x86_64, the
# address Cuore's pacman.conf names (cuore D134, D160). Edge is cuore's distro
# branch as it is: it is rebuilt on every push here and on every push to cuore's
# distro (cuore's notify-packages workflow sends a cuore-distro event). Rc is
# built by hand ("Run workflow") from a release tag, after the VM check passes.
# Stable is never built: the Promote workflow copies rc to it. The repository is
# private until the maintainer says "go", and so are its releases.

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [cuore-distro]
  workflow_dispatch:
    inputs:
      channel:
        description: Channel to publish
        required: true
        default: edge
        type: choice
        options: [edge, rc]
      ref:
        description: "cuore tag to build (rc: vX.Y.Z or vX.Y.Z-rcN); edge builds distro"
        required: false
        default: distro

# Deny everything by default; the job opts in to what it needs.
permissions: {}

concurrency:
  group: release-${{ inputs.channel || 'edge' }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: write # create the release and upload its files
    env:
      CHANNEL: ${{ inputs.channel || 'edge' }}
      REF: ${{ inputs.channel == 'rc' && inputs.ref || 'distro' }}
    steps:
      - name: Rc is built from a release tag
        if: env.CHANNEL == 'rc'
        run: |
          [[ $REF =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$ ]] ||
            { echo "rc is built from a tag like v0.1.0 or v0.1.0-rc1, not '$REF'" >&2; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: CuoreLinux/cuore
          ref: ${{ env.REF }}
          path: cuore-src
          fetch-depth: 0
          ssh-key: ${{ secrets.CUORE_READ_KEY }}
          persist-credentials: false

      - name: The signing subkey, in a keyring of its own
        env:
          SIGNING_KEY: ${{ secrets.CUORE_SIGNING_KEY }}
        run: |
          install -d -m 700 "$RUNNER_TEMP/gnupg"
          gpg --homedir "$RUNNER_TEMP/gnupg" --batch --quiet --import <<<"$SIGNING_KEY"

      - name: Build and sign every package
        run: GNUPGHOME="$RUNNER_TEMP/gnupg" bin/build --release --src "$PWD/cuore-src" --out "$RUNNER_TEMP/out"

      - name: Forget the signing subkey
        if: always()
        run: |
          gpgconf --homedir "$RUNNER_TEMP/gnupg" --kill all || true
          rm -rf "${RUNNER_TEMP:?}/gnupg"

      - name: Check every signature against Cuore's key
        run: bin/check-signatures "$PWD/cuore-src/default/pacman/signing-key.asc" "$RUNNER_TEMP/out"

      - name: Publish to ${{ env.CHANNEL }}-x86_64
        env:
          GH_TOKEN: ${{ github.token }}
        run: bin/publish "$CHANNEL-x86_64" "$RUNNER_TEMP/out"
